<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>バトスピWeb対戦</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <!-- ロビー画面 -->
    <div id="lobby">
        <h1>バトスピWeb対戦</h1>
        <div class="lobby-form">
            <label>
                名前
                <input id="name-input" type="text" placeholder="プレイヤー" />
            </label>
            <label>
                ルームID
                <input id="room-input" type="text" value="room1" />
            </label>
            <label>
                デッキ
                <select id="deck-select">
                    <option value="red">赤デッキ（低コストスピリット中心）</option>
                    <option value="purple">紫デッキ（低コストスピリット中心）</option>
                    <option value="green">緑デッキ（低コストスピリット中心）</option>
                    <option value="white">白デッキ（低コストスピリット中心）</option>
                    <option value="yellow">黄デッキ（第二弾・低コストスピリット中心）</option>
                    <option value="blue">青デッキ（第三弾・低コストスピリット中心）</option>
                </select>
            </label>
            <button id="join-btn">対戦ルームに入る</button>
            <a id="deck-builder-link" href="/deck.html">デッキ構築（デッキビルダーを開く）</a>
        </div>
        <p id="waiting-message" class="hidden">相手の参加を待っています…</p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game" class="hidden">
        <div id="status-bar">
            <button id="btn-toggle-log" class="log-toggle-btn">💬 ログ</button>
            <button id="btn-toggle-trash" class="log-toggle-btn">🗑 トラッシュ</button>
            <span id="turn-info"></span>
            <div id="phase-bar">
                <span class="phase-step" data-phase="start" data-short="開">開始</span>
                <span class="phase-step" data-phase="core" data-short="コ">コア</span>
                <span class="phase-step" data-phase="draw" data-short="ド">ドロー</span>
                <span class="phase-step" data-phase="refresh" data-short="リ">リフレ</span>
                <span class="phase-step" data-phase="main" data-short="メ">メイン</span>
                <span class="phase-step" data-phase="attack" data-short="ア">アタック</span>
                <span class="phase-step" data-phase="end" data-short="終">終了</span>
            </div>
        </div>

        <div id="board">
            <div id="event-layer"></div>
            <div id="opponent-area" class="player-area">
                <div id="opp-info" class="player-info"></div>
                <div class="field-row">
                    <div id="opp-nexuses" class="nexus-zone"></div>
                    <div id="opp-spirits" class="spirit-zone"></div>
                </div>
            </div>

            <div id="center-info-area">
                <div id="battle-info" class="hidden"></div>
                <div id="targeting-info" class="hidden"></div>
            </div>

            <div id="action-buttons-container">
                    <div id="action-buttons">
                        <button id="btn-attack-phase" class="hidden">アタックステップへ</button>
                        <button id="btn-end-turn" class="hidden">ターン終了</button>
                        <button id="btn-take-life" class="hidden">ライフで受ける</button>
                        <button id="btn-pass" class="hidden">パス</button>
                        <button id="btn-attack-player" class="hidden">プレイヤーへアタック</button>
                        <button id="btn-cancel-target" class="hidden">対象選択をやめる</button>
                        <button id="btn-skip-choice" class="hidden">選ばない</button>
                        <div id="choice-options" class="hidden"></div>
                    </div>
                </div>
            </div>

            <!-- ログパネル -->
            <div id="log-panel" class="hidden">
                <div class="log-header">
                    <span>バトルログ</span>
                    <button id="btn-close-log">✕</button>
                </div>
                <div id="log"></div>
            </div>

            <!-- トラッシュパネル -->
            <div id="trash-panel" class="hidden">
                <div class="trash-header">
                    <div class="trash-tabs">
                        <button id="tab-my-trash" class="active">自分</button>
                        <button id="tab-opp-trash">相手</button>
                    </div>
                    <button id="btn-close-trash">✕</button>
                </div>
                <div id="trash-content"></div>
            </div>

            <div id="player-area" class="player-area">
                <div class="field-row">
                    <div id="my-nexuses" class="nexus-zone"></div>
                    <div id="my-spirits" class="spirit-zone"></div>
                </div>
                <div id="my-info" class="player-info"></div>
                <div id="hand"></div>
            </div>
        </div>

        <div id="result-overlay" class="hidden">
            <div id="result-message"></div>
        </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/dist/main.js"></script>
</body>
</html>
