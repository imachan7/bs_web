<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デッキ構築｜バトスピWeb対戦（非公式）</title>
    <meta name="description" content="バトルスピリッツのカードバトルをブラウザで対戦できる非公式ファンメイドシミュレーター。第一弾〜第四弾 全521枚収録、デッキ構築対応、登録不要ですぐ遊べます。" />
    <meta property="og:title" content="デッキ構築｜バトスピWeb対戦（非公式）" />
    <meta property="og:description" content="バトルスピリッツのカードバトルをブラウザで対戦できる非公式ファンメイドシミュレーター。第一弾〜第四弾 全521枚収録、デッキ構築対応、登録不要ですぐ遊べます。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bs-web.azurewebsites.net/deck.html" />
    <link rel="canonical" href="https://bs-web.azurewebsites.net/deck.html" />
    <link rel="stylesheet" href="/css/deck.css" />
</head>
<body>
    <header id="topbar">
        <h1>デッキビルダー</h1>
        <span id="topbar-note">BS01〜BS04（全521枚）</span>
        <div style="flex-grow: 1;"></div>
        <a href="https://discord.gg/AJPTAa4kqY" target="_blank" style="margin-right: 16px; text-decoration: none; color: #66b3ff; display: flex; align-items: center; gap: 4px;">
            <svg width="16" height="16" viewBox="0 0 127.14 96.36" fill="currentColor">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-19.32-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
            Discord
        </a>
        <a href="/bugreport.html" style="margin-right: 16px; text-decoration: none; color: #66b3ff;">バグ報告</a>
        <a id="lobby-link" href="/">対戦ロビーへ</a>
    </header>

    <div id="builder">
        <!-- カードプール面 -->
        <section id="pool-pane">
            <div id="filters">
                <div class="filter-row">
                    <span class="filter-label">色</span>
                    <div class="chip-group" id="filter-colors">
                        <button class="chip chip-red" data-color="red">赤</button>
                        <button class="chip chip-purple" data-color="purple">紫</button>
                        <button class="chip chip-green" data-color="green">緑</button>
                        <button class="chip chip-white" data-color="white">白</button>
                        <button class="chip chip-yellow" data-color="yellow">黄</button>
                        <button class="chip chip-blue" data-color="blue">青</button>
                    </div>
                    <span class="filter-label">タイプ</span>
                    <div class="chip-group" id="filter-types">
                        <button class="chip" data-type="spirit">スピリット</button>
                        <button class="chip" data-type="nexus">ネクサス</button>
                        <button class="chip" data-type="magic">マジック</button>
                    </div>
                </div>
                <div class="filter-row">
                    <span class="filter-label">コスト</span>
                    <div class="chip-group" id="filter-costs">
                        <button class="chip" data-cost="0">0〜2</button>
                        <button class="chip" data-cost="1">3〜4</button>
                        <button class="chip" data-cost="2">5〜6</button>
                        <button class="chip" data-cost="3">7以上</button>
                    </div>
                </div>
                <div class="filter-row">
                    <span class="filter-label">弾</span>
                    <select id="filter-series" class="family-select">
                        <option value="">すべて</option>
                    </select>
                    <span class="filter-label">キーワード</span>
                    <select id="filter-keywords" class="family-select">
                        <option value="">すべて</option>
                    </select>
                </div>
                <div class="filter-row">
                    <span class="filter-label">系統</span>
                    <select id="filter-family" class="family-select">
                        <option value="">すべて</option>
                    </select>

                    <span class="filter-label">注意あり</span>
                    <div class="chip-group" id="filter-notes">
                        <button class="chip" data-note="unimplemented">未実装</button>
                        <button class="chip" data-note="partial">一部未実装</button>
                        <button class="chip" data-note="simplified">簡略化</button>
                    </div>

                    <input id="search-input" type="text" placeholder="カード名で検索" />
                    <button id="filter-reset">条件クリア</button>
                    <span class="filter-label" style="margin-left: 12px;">並び順</span>
                    <select id="sort-order" class="sort-select">
                        <option value="id">ID順 (デフォルト)</option>
                        <option value="cost-asc">コスト順 (低→高)</option>
                        <option value="cost-desc">コスト順 (高→低)</option>
                    </select>
                    <span id="pool-count" style="margin-left: auto;"></span>
                </div>
            </div>

            <div id="pool-grid"></div>

            <!-- カード詳細（ホバー / 選択で表示） -->
            <div id="detail-panel" class="hidden"></div>
        </section>

        <!-- デッキ面 -->
        <section id="deck-pane">
            <div id="deck-header">
                <input id="deck-name-input" type="text" placeholder="デッキ名" />
                <span id="deck-count">0 / 40</span>
            </div>
            <div id="deck-validation"></div>
            <div id="deck-list"></div>

            <div id="deck-stats">
                <h2>統計</h2>
                <div class="stats-block">
                    <h3>コストカーブ</h3>
                    <div id="cost-curve"></div>
                </div>
                <div class="stats-columns">
                    <div class="stats-block">
                        <h3>色内訳</h3>
                        <div id="color-stats"></div>
                    </div>
                    <div class="stats-block">
                        <h3>タイプ内訳</h3>
                        <div id="type-stats"></div>
                    </div>
                </div>
            </div>

            <div id="deck-io">
                <h2>保存・書き出し</h2>
                <div class="io-row">
                    <button id="btn-save">ブラウザに保存</button>
                    <button id="btn-clear">デッキを空にする</button>
                </div>
                <div id="saved-decks"></div>
                <div class="io-row">
                    <button id="btn-export">JSONを書き出す</button>
                    <label id="import-label" for="import-file">JSONを読み込む</label>
                    <input id="import-file" type="file" accept=".json,application/json" />
                </div>
                <div id="import-result" class="hidden"></div>
                <div class="io-row">
                    <span class="io-label">プリセット</span>
                    <button class="preset-btn chip-red" data-preset="red">赤</button>
                    <button class="preset-btn chip-purple" data-preset="purple">紫</button>
                    <button class="preset-btn chip-green" data-preset="green">緑</button>
                    <button class="preset-btn chip-white" data-preset="white">白</button>
                    <button class="preset-btn chip-yellow" data-preset="yellow">黄</button>
                    <button class="preset-btn chip-blue" data-preset="blue">青</button>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="/dist/deck.js"></script>
</body>
</html>
