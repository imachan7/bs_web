name: 検証（typecheck / smoke / E2E）

# main への push と、main 宛の PR で検証を回す。
# デプロイは Actions 画面の「Run workflow」（workflow_dispatch）で main を選んだときだけ行う。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  NODE_VERSION: "22"

permissions:
  contents: read
  id-token: write # Workload Identity Federation で GCP に認証するための OIDC トークン

# 同じブランチの古い実行は捨てる（デプロイしないので途中で止めて困らない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.js をセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: クライアントをビルド
        run: npm run build

      - name: 型チェック
        run: npm run typecheck

      # CLAUDE.md の「バッチ完了時の定型」に揃える（カードデータは型検査の対象外なので、
      # ここを落とすと効果の実装漏れ・注意書きの不整合がすり抜ける）
      - name: カードデータの検査
        run: npm run validate:cards && npm run validate:notes && npm run validate:gaps

      - name: スモークテスト（エンジン単体）
        run: npm run smoke:quiet

      - name: E2Eテスト（サーバー起動 → 疎通確認）
        # BS_AI_DELAY_MS=0：AI戦の検証で、AIが1手ごとに450ms待つのを止める
        # （実対戦では人間が目で追えるよう間を空けているが、CIでは待つ意味がない）
        run: |
          BS_AI_DELAY_MS=0 PORT=3100 npx tsx server/src/index.ts &
          SERVER_PID=$!
          # サーバー起動待ち（/health が 200 を返すまで待機）
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3100/health > /dev/null; then
              break
            fi
            sleep 1
          done
          PORT=3100 npx tsx scripts/e2e.ts
          kill $SERVER_PID

  # 手動実行（workflow_dispatch）のときだけ本番へ出す。verify が通ってからしか走らない。
  # マージのたびに出さないのは、部屋がメモリ上にあり、デプロイで対戦中の試合が消えるため（2026-09-23 ユーザー決定）。
  # 認証は Workload Identity Federation＝**鍵ファイルを GitHub に置かない**方式。
  # サービスアカウントのJSONキーは漏れると永続的に悪用されるため使わない。
  # 借りられるのは imachan7/bs_web からのみ（プロバイダの attribute-condition で縛ってある）。
  # フラグの意味は docs/ops/DEPLOY_CLOUDRUN.md §2（消すと本番が壊れる。特に --max-instances=1）
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 同時に2つデプロイしない。実行中のものは中断しない（本番が不整合になるため後続を待たせる）
    concurrency:
      group: deploy-cloudrun
      cancel-in-progress: false
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: GCP に認証（Workload Identity Federation）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: gcloud をセットアップ
        uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Run へデプロイ
        run: |
          gcloud run deploy bs-web \
            --source . \
            --project=bs-web-imachan \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --cpu-boost \
            --timeout=3600 \
            --concurrency=80 \
            --quiet

      - name: デプロイ後のヘルスチェック
        run: |
          for i in $(seq 1 30); do
            if curl -fs "https://bs-web-battle.app/health" > /dev/null; then
              echo "本番の /health が応答しました"
              exit 0
            fi
            echo "起動待ち... ($i/30)"
            sleep 10
          done
          echo "::error::デプロイ後に /health が応答しませんでした"
          exit 1
